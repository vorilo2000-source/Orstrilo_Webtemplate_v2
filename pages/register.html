<!DOCTYPE html>
<html lang="nl">
<head>
    <!-- ======================= META ======================= -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registreren</title>

    <!-- ======================= STYLES ======================= -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <!-- ======================= SHARED HEADER ======================= -->
    <div id="header-placeholder"></div>

    <!-- ======================= LOGIN FORM ======================= -->
    <main class="page-shell">
        <form id="register-form" class="auth-card">
            <h1 data-i18n="auth:registerTitle">Registreren</h1>

            <label for="login-email" data-i18n="auth:email">E-mail</label>
            <input id="login-email" type="email" autocomplete="email" required>

            <label for="login-password" data-i18n="auth:password">Wachtwoord</label>
            <input id="login-password" type="password" autocomplete="new-password" required>

            <button class="button" type="submit" data-i18n="auth:registerButton">Registreren</button>

            <p><a href="register.html" data-i18n="auth:registerLink">Account aanmaken</a></p>
            <p><a href="forgot-password.html" data-i18n="auth:forgotLink">Wachtwoord vergeten?</a></p>
        </form>
    </main>

    <!-- ======================= SHARED FOOTER ======================= -->
    <div id="footer-placeholder"></div>

    <!-- ======================= SCRIPTS ======================= -->
    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
