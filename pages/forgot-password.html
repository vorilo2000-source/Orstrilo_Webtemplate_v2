<!DOCTYPE html>
<html lang="nl">
<head>
    <!-- ======================= META ======================= -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wachtwoord vergeten</title>

    <!-- ======================= STYLES ======================= -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <!-- ======================= SHARED HEADER ======================= -->
    <div id="header-placeholder"></div>

    <!-- ======================= PASSWORD RESET ======================= -->
    <main class="page-shell">
        <form id="forgot-password-form" class="auth-card">
            <h1 data-i18n="auth:forgotTitle">Wachtwoord herstellen</h1>
            <label for="reset-email" data-i18n="auth:email">E-mail</label>
            <input id="reset-email" type="email" autocomplete="email" required>
            <button class="button" type="submit" data-i18n="auth:resetButton">Herstellink versturen</button>
        </form>
    </main>

    <!-- ======================= SHARED FOOTER ======================= -->
    <div id="footer-placeholder"></div>

    <!-- ======================= SCRIPTS ======================= -->
    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
